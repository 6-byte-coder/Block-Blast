<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Web Game</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #ffcc00; }
        #score { font-size: 24px; margin-bottom: 20px; font-weight: bold; }
        
        /* Papan Permainan 8x8 */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 40px);
            grid-template-rows: repeat(8, 40px);
            gap: 2px;
            background: #333;
            padding: 5px;
            border-radius: 8px;
            margin: 0 auto 20px auto;
            width: max-content;
        }
        .cell {
            width: 40px;
            height: 40px;
            background-color: #2b2b3d;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .cell.filled {
            background-color: #ff5722;
            color: white;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }

        /* Area Pilihan Balok */
        .pieces-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .piece-box {
            background: #2b2b3d;
            border: 2px solid #444;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .piece-box.selected {
            border-color: #ffcc00;
            background: #3a3a52;
            transform: scale(1.05);
        }
        .mini-grid {
            display: grid;
            grid-template-columns: repeat(4, 20px);
            grid-template-rows: repeat(4, 20px);
            gap: 2px;
        }
        .mini-cell {
            width: 20px;
            height: 20px;
            background: #1e1e2f;
            border-radius: 2px;
        }
        .mini-cell.filled {
            background-color: #4caf50;
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            color: #ff6b6b;
            min-height: 25px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffcc00;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #1e1e2f;
        }
        button:hover { background-color: #e6b800; }
    </style>
</head>
<body>

    <h1>Block Blast Web</h1>
    <div id="score">Skor: 0</div>
    
    <div class="board" id="game-board"></div>
    
    <div id="message">Pilih salah satu balok di bawah, lalu klik kotak di papan!</div>

    <div class="pieces-container" id="pieces-container"></div>

    <br>
    <button onclick="resetGame()">Mulai Ulang</button>

    <script>
        const SIZE = 8;
        let board = Array(SIZE).fill(null).map(() => Array(SIZE).fill('.'));
        let score = 0;
        let selectedPieceIndex = null;

        // Daftar bentuk balok (mirip kode C++ Anda)
        const allPieces = [
            { cells: [[0,0]], symbol: 'A' },
            { cells: [[0,0], [0,1]], symbol: 'B' },
            { cells: [[0,0], [1,0]], symbol: 'C' },
            { cells: [[0,0], [0,1], [0,2]], symbol: 'D' },
            { cells: [[0,0], [1,0], [2,0]], symbol: 'E' },
            { cells: [[0,0], [0,1], [1,0], [1,1]], symbol: 'F' },
            { cells: [[0,0], [1,0], [1,1]], symbol: 'I' }
        ];

        let currentPieces = [];
        let usedPieces = [false, false, false];

        function initGame() {
            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill('.'));
            score = 0;
            refillPieces();
            updateUI();
        }

        function refillPieces() {
            currentPieces = [];
            usedPieces = [false, false, false];
            for (let i = 0; i < 3; i++) {
                let randomIndex = Math.floor(Math.random() * allPieces.length);
                currentPieces.push(allPieces[randomIndex]);
            }
        }

        function updateUI() {
            document.getElementById('score').innerText = "Skor: " + score;
            
            // Render Papan
            const boardEl = document.getElementById('game-board');
            boardEl.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell' + (board[r][c] !== '.' ? ' filled' : '');
                    cellEl.dataset.row = r;
                    cellEl.dataset.col = c;
                    cellEl.onclick = () => handleCellClick(r, c);
                    boardEl.appendChild(cellEl);
                }
            }

            // Render Pilihan Balok
            const container = document.getElementById('pieces-container');
            container.innerHTML = '';
            currentPieces.forEach((piece, index) => {
                const box = document.createElement('div');
                box.className = 'piece-box' + (selectedPieceIndex === index ? ' selected' : '');
                if (usedPieces[index]) {
                    box.style.opacity = '0.3';
                    box.style.pointerEvents = 'none';
                }
                box.onclick = () => {
                    selectedPieceIndex = index;
                    document.getElementById('message').innerText = `Balok ${index + 1} dipilih. Klik papan untuk meletakkan!`;
                    updateUI();
                };

                const miniGrid = document.createElement('div');
                miniGrid.className = 'mini-grid';
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const mCell = document.createElement('div');
                        mCell.className = 'mini-cell';
                        if (piece.cells.some(cell => cell[0] === r && cell[1] === c)) {
                            mCell.classList.add('filled');
                        }
                        miniGrid.appendChild(mCell);
                    }
                }
                box.appendChild(miniGrid);
                container.appendChild(box);
            });

            checkGameOver();
        }

        function canPlace(piece, row, col) {
            for (let cell of piece.cells) {
                let bRow = row + cell[0];
                let bCol = col + cell[1];
                if (bRow < 0 || bRow >= SIZE || bCol < 0 || bCol >= SIZE) return false;
                if (board[bRow][bCol] !== '.') return false;
            }
            return true;
        }

        function handleCellClick(row, col) {
            if (selectedPieceIndex === null || usedPieces[selectedPieceIndex]) {
                document.getElementById('message').innerText = "Pilih balok yang aktif terlebih dahulu!";
                return;
            }

            let piece = currentPieces[selectedPieceIndex];
            if (!canPlace(piece, row, col)) {
                document.getElementById('message').innerText = "Balok tidak bisa diletakkan di posisi itu!";
                return;
            }

            // Letakkan balok
            for (let cell of piece.cells) {
                board[row + cell[0]][col + cell[1]] = piece.symbol;
            }

            usedPieces[selectedPieceIndex] = true;
            score += piece.cells.length * 10;

            // Bersihkan baris/kolom penuh
            clearLines();

            selectedPieceIndex = null;
            document.getElementById('message').innerText = "Berhasil dipasang!";

            if (usedPieces.every(u => u)) {
                refillPieces();
            }

            updateUI();
        }

        function clearLines() {
            let fullRows = Array(SIZE).fill(false);
            let fullCols = Array(SIZE).fill(false);
            let clearedCount = 0;

            for (let r = 0; r < SIZE; r++) {
                if (board[r].every(cell => cell !== '.')) fullRows[r] = true;
            }
            for (let c = 0; c < SIZE; c++) {
                if (board.every(row => row[c] !== '.')) fullCols[c] = true;
            }

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (fullRows[r] || fullCols[c]) {
                        if (board[r][c] !== '.') {
                            board[r][c] = '.';
                            clearedCount++;
                        }
                    }
                }
            }

            if (clearedCount > 0) {
                score += clearedCount * 100;
            }
        }

        function checkGameOver() {
            let hasMove = false;
            for (let i = 0; i < 3; i++) {
                if (usedPieces[i]) continue;
                let piece = currentPieces[i];
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        if (canPlace(piece, r, c)) hasMove = true;
                    }
                }
            }

            if (!hasMove && usedPieces.some(u => !u)) {
                document.getElementById('message').innerText = "GAME OVER! Skor Akhir: " + score;
            }
        }

        function resetGame() {
            selectedPieceIndex = null;
            initGame();
            document.getElementById('message').innerText = "Game baru dimulai. Selamat bermain!";
        }

        // Jalankan game saat pertama kali dibuka
        initGame();
    </script>
</body>
</html>
